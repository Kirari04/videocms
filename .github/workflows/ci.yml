name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - master
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  promotion-source:
    name: promotion-source
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Promotion source checks only apply to pull requests."
            exit 0
          fi

          target="$TARGET_BRANCH"
          source="$SOURCE_BRANCH"

          case "$target" in
            staging)
              if [ "$source" != "dev" ]; then
                echo "Pull requests into staging must come from dev, got: $source"
                exit 1
              fi
              ;;
            master)
              if [ "$source" != "staging" ]; then
                echo "Pull requests into master must come from staging, got: $source"
                exit 1
              fi
              ;;
            dev)
              echo "Feature and maintenance branches may target dev."
              ;;
            *)
              echo "No promotion policy configured for target branch: $target"
              ;;
          esac

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Start MinIO integration service
        run: |
          docker run --detach --name videocms-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=videocms-ci \
            --env MINIO_ROOT_PASSWORD=videocms-ci-secret \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs videocms-minio
              exit 1
            fi
            sleep 1
          done
          docker exec videocms-minio mc alias set local http://127.0.0.1:9000 videocms-ci videocms-ci-secret
          docker exec videocms-minio mc mb --ignore-existing local/videocms-ci

      - name: Test
        env:
          VIDEOCMS_S3_INTEGRATION_ENDPOINT: http://127.0.0.1:9000
          VIDEOCMS_S3_INTEGRATION_BUCKET: videocms-ci
          VIDEOCMS_S3_INTEGRATION_REGION: us-east-1
          VIDEOCMS_S3_INTEGRATION_ACCESS_KEY_ID: videocms-ci
          VIDEOCMS_S3_INTEGRATION_SECRET_ACCESS_KEY: videocms-ci-secret
        run: go test ./...

      - name: Stop MinIO integration service
        if: always()
        run: docker rm --force videocms-minio || true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /tmp/videocms ./main.go

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.18'

      - name: Restore Bun dependency cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-frontend-${{ runner.os }}-${{ hashFiles('videocms-frontend/bun.lock') }}
          restore-keys: |
            bun-frontend-${{ runner.os }}-

      - name: Install dependencies
        working-directory: videocms-frontend
        run: bun install --frozen-lockfile

      - name: Configure frontend build
        working-directory: videocms-frontend
        run: |
          cat > .env <<'EOF'
          NUXT_PUBLIC_API_URL=/api
          NUXT_PUBLIC_BASE_URL=
          NUXT_PUBLIC_DOCKER_HUB_TAG=kirari04/videocms:ci
          NUXT_PUBLIC_NAME=VideoCMS
          NUXT_PUBLIC_DEMO=false
          NUXT_PUBLIC_RELEASE_CHANNEL=ci
          EOF

      - name: Generate frontend
        working-directory: videocms-frontend
        run: bun run generate

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.18'

      - name: Restore Bun dependency cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-docs-${{ runner.os }}-${{ hashFiles('videocms-docs/bun.lockb') }}
          restore-keys: |
            bun-docs-${{ runner.os }}-

      - name: Install dependencies
        working-directory: videocms-docs
        run: bun install --frozen-lockfile

      - name: Build docs
        working-directory: videocms-docs
        run: bun run docs:build

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore Docker cache mounts
        id: cache-mounts
        uses: actions/cache@v5
        with:
          path: .buildkit-cache
          key: buildkit-mounts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'go.sum', 'videocms-frontend/bun.lock') }}
          restore-keys: |
            buildkit-mounts-${{ runner.os }}-${{ runner.arch }}-

      - name: Inject Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: .buildkit-cache
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache-mounts.outputs.cache-hit }}

      - name: Validate Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=videocms-linux-amd64
          cache-to: type=gha,scope=videocms-linux-amd64,mode=max
          build-args: |
            VERSION=ci-${{ github.sha }}
            CHANNEL=ci
            DOCKER_IMAGE_TAG=kirari04/videocms:ci
