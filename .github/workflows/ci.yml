name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - master
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  promotion-source:
    name: promotion-source
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Promotion source checks only apply to pull requests."
            exit 0
          fi

          target="$TARGET_BRANCH"
          source="$SOURCE_BRANCH"

          case "$target" in
            staging)
              if [ "$source" != "dev" ]; then
                echo "Pull requests into staging must come from dev, got: $source"
                exit 1
              fi
              ;;
            master)
              if [ "$source" != "staging" ]; then
                echo "Pull requests into master must come from staging, got: $source"
                exit 1
              fi
              ;;
            dev)
              echo "Feature and maintenance branches may target dev."
              ;;
            *)
              echo "No promotion policy configured for target branch: $target"
              ;;
          esac

  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Start Garage integration service
        run: |
          docker run --detach --name videocms-garage \
            --publish 3900:3900 \
            --volume "$PWD/.github/garage-ci.toml:/etc/garage.toml:ro" \
            --env GARAGE_DEFAULT_ACCESS_KEY=GK0123456789abcdef0123456789abcdef \
            --env GARAGE_DEFAULT_SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            --env GARAGE_DEFAULT_BUCKET=videocms-ci \
            dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690 \
            /garage server --single-node --default-bucket
          for attempt in {1..30}; do
            if docker exec videocms-garage /garage status >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs videocms-garage
              exit 1
            fi
            sleep 1
          done

      - name: Start OpenSSH integration service
        run: |
          docker run --detach --name videocms-sftp \
            --publish 127.0.0.1:2222:22 \
            atmoz/sftp:debian@sha256:b6ce5fad1fb0b4cd5b6316afb4be651f636074f45d0e59392c403e9766edfd7b \
            'videocms:test-password:::upload'
          for attempt in {1..30}; do
            ssh-keyscan -T 1 -p 2222 127.0.0.1 > /tmp/videocms-sftp-host-keys 2>/dev/null || true
            if test -s /tmp/videocms-sftp-host-keys; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs videocms-sftp
              exit 1
            fi
            sleep 1
          done
          fingerprints="$(ssh-keygen -lf /tmp/videocms-sftp-host-keys -E sha256 | awk '{print $2}' | sort -u | paste -sd, -)"
          if [ -z "$fingerprints" ]; then
            docker logs videocms-sftp
            exit 1
          fi
          echo "VIDEOCMS_SFTP_INTEGRATION_HOST_KEY_FINGERPRINTS=$fingerprints" >> "$GITHUB_ENV"

      - name: Test
        env:
          VIDEOCMS_S3_INTEGRATION_ENDPOINT: http://127.0.0.1:3900
          VIDEOCMS_S3_INTEGRATION_BUCKET: videocms-ci
          VIDEOCMS_S3_INTEGRATION_REGION: garage
          VIDEOCMS_S3_INTEGRATION_ACCESS_KEY_ID: GK0123456789abcdef0123456789abcdef
          VIDEOCMS_S3_INTEGRATION_SECRET_ACCESS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          VIDEOCMS_SFTP_INTEGRATION_HOST: 127.0.0.1
          VIDEOCMS_SFTP_INTEGRATION_PORT: 2222
          VIDEOCMS_SFTP_INTEGRATION_USERNAME: videocms
          VIDEOCMS_SFTP_INTEGRATION_PASSWORD: test-password
          VIDEOCMS_SFTP_INTEGRATION_ROOT: /upload
        run: go test ./...

      - name: Stop integration services
        if: always()
        run: docker rm --force videocms-garage videocms-sftp || true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /tmp/videocms ./main.go

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.18'

      - name: Restore Bun dependency cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-frontend-${{ runner.os }}-${{ hashFiles('videocms-frontend/bun.lock') }}
          restore-keys: |
            bun-frontend-${{ runner.os }}-

      - name: Install dependencies
        working-directory: videocms-frontend
        run: bun install --frozen-lockfile

      - name: Configure frontend build
        working-directory: videocms-frontend
        run: |
          cat > .env <<'EOF'
          NUXT_PUBLIC_API_URL=/api
          NUXT_PUBLIC_BASE_URL=
          NUXT_PUBLIC_DOCKER_HUB_TAG=kirari04/videocms:ci
          NUXT_PUBLIC_NAME=VideoCMS
          NUXT_PUBLIC_DEMO=false
          NUXT_PUBLIC_RELEASE_CHANNEL=ci
          EOF

      - name: Generate frontend
        working-directory: videocms-frontend
        run: bun run generate

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.18'

      - name: Restore Bun dependency cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-docs-${{ runner.os }}-${{ hashFiles('videocms-docs/bun.lockb') }}
          restore-keys: |
            bun-docs-${{ runner.os }}-

      - name: Install dependencies
        working-directory: videocms-docs
        run: bun install --frozen-lockfile

      - name: Build docs
        working-directory: videocms-docs
        run: bun run docs:build

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore Docker cache mounts
        id: cache-mounts
        uses: actions/cache@v5
        with:
          path: .buildkit-cache
          key: buildkit-mounts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'go.sum', 'videocms-frontend/bun.lock') }}
          restore-keys: |
            buildkit-mounts-${{ runner.os }}-${{ runner.arch }}-

      - name: Inject Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: .buildkit-cache
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache-mounts.outputs.cache-hit }}

      - name: Validate Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=videocms-linux-amd64
          cache-to: type=gha,scope=videocms-linux-amd64,mode=max
          build-args: |
            VERSION=ci-${{ github.sha }}
            CHANNEL=ci
            DOCKER_IMAGE_TAG=kirari04/videocms:ci
