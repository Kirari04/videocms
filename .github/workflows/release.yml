name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/kirari04/videocms
  DOCKERHUB_IMAGE: kirari04/videocms

jobs:
  version:
    name: resolve-version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          head_tag="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [ -n "$head_tag" ]; then
            echo "version=$head_tag" >> "$GITHUB_OUTPUT"
            echo "Release version already tagged on HEAD: $head_tag"
            exit 0
          fi

          source_version="$(tr -d '[:space:]' < VERSION.txt)"
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"

          if [ -z "$latest_tag" ]; then
            version="$source_version"
          elif [ -n "$source_version" ] && ! git rev-parse -q --verify "refs/tags/$source_version" >/dev/null && [ "$(printf '%s\n%s\n' "$latest_tag" "$source_version" | sort -V | tail -n1)" = "$source_version" ]; then
            version="$source_version"
          else
            raw="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$raw"
            version="v${major}.${minor}.$((patch + 1))"
          fi

          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Resolved invalid release version: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $version"

  verify-go:
    name: verify-go
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify Go project
        run: |
          go mod download
          go test ./...
          go vet ./...
          go build -o /tmp/videocms ./main.go

  verify-frontend:
    name: verify-frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.18'

      - name: Restore Bun dependency cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-frontend-${{ runner.os }}-${{ hashFiles('videocms-frontend/bun.lock') }}
          restore-keys: |
            bun-frontend-${{ runner.os }}-

      - name: Verify frontend generation
        working-directory: videocms-frontend
        run: |
          bun install --frozen-lockfile
          cat > .env <<'EOF'
          NUXT_PUBLIC_API_URL=/api
          NUXT_PUBLIC_BASE_URL=
          NUXT_PUBLIC_DOCKER_HUB_TAG=kirari04/videocms:beta
          NUXT_PUBLIC_NAME=VideoCMS
          NUXT_PUBLIC_DEMO=false
          NUXT_PUBLIC_RELEASE_CHANNEL=beta
          EOF
          bun run generate

  verify-docs:
    name: verify-docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.18'

      - name: Restore Bun dependency cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-docs-${{ runner.os }}-${{ hashFiles('videocms-docs/bun.lockb') }}
          restore-keys: |
            bun-docs-${{ runner.os }}-

      - name: Verify docs build
        working-directory: videocms-docs
        run: |
          bun install --frozen-lockfile
          bun run docs:build

  build:
    name: build-release-${{ matrix.arch }}
    needs:
      - version
      - verify-go
      - verify-frontend
      - verify-docs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore Docker cache mounts
        id: cache-mounts
        uses: actions/cache@v5
        with:
          path: .buildkit-cache
          key: buildkit-mounts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Dockerfile', 'go.sum', 'videocms-frontend/bun.lock') }}
          restore-keys: |
            buildkit-mounts-${{ runner.os }}-${{ runner.arch }}-

      - name: Inject Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.3.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: .buildkit-cache
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache-mounts.outputs.cache-hit }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release binary
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: binary
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=dist
          cache-from: |
            type=gha,scope=videocms-linux-${{ matrix.arch }}
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-release-${{ matrix.arch }}
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-staging-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            CHANNEL=beta
            DOCKER_IMAGE_TAG=${{ env.DOCKERHUB_IMAGE }}:beta

      - name: Prepare release binary
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/videocms
          mv dist/videocms "dist/videocms_linux_${{ matrix.arch }}"
          chmod +x "dist/videocms_linux_${{ matrix.arch }}"

      - name: Upload release binary
        uses: actions/upload-artifact@v6
        with:
          name: release-binary-${{ matrix.arch }}
          path: dist/videocms_linux_${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      - name: Build and push release image by digest
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=videocms-linux-${{ matrix.arch }}
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-release-${{ matrix.arch }}
            type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-staging-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-release-${{ matrix.arch }},mode=max
          sbom: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            CHANNEL=beta
            DOCKER_IMAGE_TAG=${{ env.DOCKERHUB_IMAGE }}:beta

      - name: Record image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          digest="${DIGEST#sha256:}"
          if [ -z "$digest" ] || [ "$digest" = "$DIGEST" ]; then
            echo "Invalid image digest: $DIGEST"
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/$digest"

      - name: Upload image digest
        uses: actions/upload-artifact@v6
        with:
          name: release-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish-release
    needs:
      - version
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download image digests
        uses: actions/download-artifact@v7
        with:
          pattern: release-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Download release binaries
        uses: actions/download-artifact@v7
        with:
          pattern: release-binary-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: |
          chmod +x dist/videocms_linux_amd64 dist/videocms_linux_arm64
          (cd dist && sha256sum videocms_linux_amd64 videocms_linux_arm64 > checksums.txt)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create release manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          sources=()
          for digest_path in /tmp/digests/*; do
            if [ -f "$digest_path" ]; then
              sources+=("${GHCR_IMAGE}@sha256:$(basename "$digest_path")")
            fi
          done

          if [ "${#sources[@]}" -ne 2 ]; then
            echo "Expected two platform digests, found ${#sources[@]}"
            exit 1
          fi

          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:beta" \
            --tag "${GHCR_IMAGE}:latest" \
            --tag "${GHCR_IMAGE}:${VERSION}" \
            "${sources[@]}"

          docker buildx imagetools create \
            --tag "${DOCKERHUB_IMAGE}:beta" \
            --tag "${DOCKERHUB_IMAGE}:latest" \
            --tag "${DOCKERHUB_IMAGE}:${VERSION}" \
            "${GHCR_IMAGE}:${VERSION}"

      - name: Verify published manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}"

      - name: Create tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v "^${VERSION}$" | head -n1 || true)"

          {
            echo "VideoCMS ${VERSION}"
            echo
            echo "Docker images:"
            echo
            echo "- ${GHCR_IMAGE}:${VERSION}"
            echo "- ${GHCR_IMAGE}:beta"
            echo "- ${GHCR_IMAGE}:latest"
            echo "- ${DOCKERHUB_IMAGE}:${VERSION}"
            echo "- ${DOCKERHUB_IMAGE}:beta"
            echo "- ${DOCKERHUB_IMAGE}:latest"
            echo
            if [ -n "$previous_tag" ]; then
              echo "Changes since ${previous_tag}:"
              echo
              git log --oneline "${previous_tag}..HEAD"
            else
              echo "Initial automated release."
            fi
          } > release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file release-notes.md --latest --target "$GITHUB_SHA"
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file release-notes.md --latest --verify-tag --target "$GITHUB_SHA"
          fi

          gh release upload "$VERSION" \
            dist/videocms_linux_amd64 \
            dist/videocms_linux_arm64 \
            dist/checksums.txt \
            --clobber
